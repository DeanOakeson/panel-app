name: Checks

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next build also type-checks.
      # Deliberately run WITHOUT any NEXT_PUBLIC_FIREBASE_* env vars: Vercel
      # preview builds have none, so module-scope Firebase init (getAuth) would
      # crash prerendering there but pass CI if we supplied placeholders here.
      # An env-less build keeps CI's failure mode identical to preview's.
      - run: npm run build

      # The Firestore emulator that npm test starts needs Java 21 or newer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm test --if-present
