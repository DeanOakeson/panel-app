name: Checks

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next build also type-checks
      # Placeholders let the client SDK initialize during prerender. Nothing calls Firebase at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-panel-app.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-panel-app
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

      # The Firestore emulator that npm test starts needs Java 21 or newer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm test --if-present
