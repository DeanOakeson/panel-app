name: Checks

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next build also type-checks.
      # Deliberately run WITHOUT any NEXT_PUBLIC_FIREBASE_* env vars: Vercel
      # preview builds have none, so module-scope Firebase init (getAuth) would
      # crash prerendering there but pass CI if we supplied placeholders here.
      # An env-less build keeps CI's failure mode identical to preview's.
      - run: npm run build

      # The Firestore emulator that npm test starts needs Java 21 or newer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm test --if-present

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The Firebase emulators need Java 21 or newer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - id: versions
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "firebase=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.versions.outputs.firebase }}

      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs the system libraries it links against
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
