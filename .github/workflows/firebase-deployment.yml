name: Firebase deployment

on:
  pull_request:
    branches: [dev, main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/firebase-deployment.yml
  push:
    branches: [dev, main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/firebase-deployment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate checked-in Firestore configuration
        shell: bash
        run: |
          for file in firebase.json firestore.rules firestore.indexes.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing $file. Import the existing configuration as described in docs/firebase-deployment.md."
              exit 1
            fi
          done
          jq -e '.firestore.rules == "firestore.rules" and .firestore.indexes == "firestore.indexes.json"' firebase.json
          jq -e '(.indexes | type == "array") and (.fieldOverrides | type == "array")' firestore.indexes.json

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ secrets[format('FIREBASE_{0}_PROJECT_ID', github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING')] }}
      WIF_PROVIDER: ${{ secrets[format('FIREBASE_{0}_WIF_PROVIDER', github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING')] }}
      DEPLOY_SERVICE_ACCOUNT: ${{ secrets[format('FIREBASE_{0}_SERVICE_ACCOUNT', github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING')] }}
    steps:
      - uses: actions/checkout@v7

      - name: Check deployment configuration
        shell: bash
        run: |
          for variable in FIREBASE_PROJECT_ID WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing $variable. Configure repository secrets using docs/firebase-deployment.md."
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
